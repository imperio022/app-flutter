plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.imperio022.app"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.imperio022.app"
        minSdk = 21
        targetSdk = 34
        versionCode = 1
        versionName = "1.0.0"
    }

    signingConfigs {
        release {
            def keystorePath = keystorePropertiesFile.exists()
                ? rootProject.file(keystoreProperties['storeFile'])
                : rootProject.file('app-upload-keystore.jks')
            storeFile keystorePath
            storePassword keystoreProperties.getProperty('storePassword', System.getenv('KEYSTORE_PASSWORD') ?: '')
            keyAlias keystoreProperties.getProperty('keyAlias', System.getenv('KEYSTORE_ALIAS') ?: '')
            keyPassword keystoreProperties.getProperty('keyPassword', System.getenv('KEYSTORE_KEY_PASSWORD') ?: '')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

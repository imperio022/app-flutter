name: imperio022_app
description: Império 022 - Sistema de Gestão Automotiva para Lava Jato
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State Management
  flutter_riverpod: ^2.4.9
  # Navigation
  go_router: ^13.0.1
  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  lucide_icons: ^0.257.0
  # HTTP Client
  http: ^1.2.0
  dio: ^5.4.0
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Authentication
  flutter_secure_storage: ^9.0.0
  # Camera & Scanner
  camera: ^0.10.5+9
  mobile_scanner: ^4.0.1
  # QR Code
  qr_flutter: ^4.1.0
  # PDF
  pdf: ^3.10.7
  printing: ^5.12.0
  # Charts
  fl_chart: ^0.66.2
  # Date
  intl: ^0.19.0
  # Location & Maps
  geolocator: ^11.0.0
  # Weather
  weather: ^3.1.1
  # Image Picker
  image_picker: ^1.0.7
  # Notification
  flutter_local_notifications: ^17.0.0
  # Connectivity
  connectivity_plus: ^6.0.1
  # Utilities
  url_launcher: ^6.2.2
  path_provider: ^2.1.1
  fluttertoast: ^8.2.4
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
  workflow_dispatch: # Permite trigger manual

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze || true

      - name: Run tests
        run: flutter test --no-pub || true

      # Criar keystore no CI a partir de variáveis de ambiente (Base64)
      - name: Create keystore
        if: github.event_name != 'pull_request' && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app-upload-keystore.jks
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_KEY_PASSWORD
          keyAlias=$KEYSTORE_ALIAS
          storeFile=app-upload-keystore.jks
          EOF
          echo "Keystore configurado com sucesso"

      - name: Build APK (com keystore se disponível)
        if: github.event_name != 'pull_request'
        run: flutter build apk --release

      - name: Build APK Debug (fallback para PR)
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: imperio022-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Império 022 v1.0.${{ github.run_number }}
          body: |
            ## Império 022 - Build Automático
            - **Branch:** main
            - **Commit:** ${{ github.sha }}
            - **Data:** ${{ github.event.head_commit.timestamp }}
            - **Versão:** 1.0.${{ github.run_number }}
            
            ### APK para Download
            Download o APK abaixo para instalar diretamente no dispositivo Android.
            
            **Instalação:**
            1. Baixe o APK abaixo
            2. Permita instalação de fontes desconhecidas
            3. Instale e abra o app
            
            **Nota:** Se você configurou o `KEYSTORE_BASE64` nos Secrets, o APK está assinado para distribuição.
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify success
        if: success()
        run: |
          echo "✅ APK gerado com sucesso!"
          echo "📦 Tamanho: $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)"
          echo "🔗 Release: https://github.com/${{ github.repository }}/releases/tag/v1.0.${{ github.run_number }}"

  build-aab:
    name: Build AAB (Play Store)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app-upload-keystore.jks
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_KEY_PASSWORD
          keyAlias=$KEYSTORE_ALIAS
          storeFile=app-upload-keystore.jks
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: imperio022-app-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
